version: 2

models:
  - name: int_checkout_cart_items
    description: "Bảng dữ liệu phẳng bóc tách chi tiết từng sản phẩm trong giỏ hàng."
    columns:
      - name: order_id
        description: "Khóa ngoại liên kết về bảng order staging."
        tests:
          - null_check
          
      - name: product_id
        description: "Mã sản phẩm (Bắt buộc phải có để map với bảng Dim)."
        tests:
          - null_check
          
      - name: price
        description: "Giá của sản phẩm, không được phép âm."
        tests:
          - null_check
          - non_negative_value # Gọi macro test vừa tạo

      - name: amount
        description: "Số lượng sản phẩm mua."
        tests:
          - null_check
          - non_negative_value # Tái sử dụng test này cho cột số lượng4

  - name: int_customer_history
    description: "Bảng xử lý logic SCD Type 2 cho hành trình khách hàng."
    columns:
      - name: active_from
        description: "Mốc thời gian bắt đầu trạng thái."
        tests:
          - null_check